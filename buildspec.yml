version: 0.2

# 以下の変数は buildspec.yml には値を書かず、CodeBuildプロジェクトの「環境変数」で設定する
#   AWS_REGION                 : ap-northeast-1
#   AWS_ACCOUNT_ID             : AWSアカウントID
#   ECR_REPOSITORY             : java-otel-app
#   IMAGE_TAG                  : latest
#   CODEARTIFACT_DOMAIN        : artifact-domain
#   CODEARTIFACT_DOMAIN_OWNER  : CodeArtifactドメイン所有者（アカウントID）
#   SIGNING_PROFILE_ARN        : AWS Signer署名プロファイルのARN（イメージ署名に使用）
# これらをソースに書かないことで、パブリックリポジトリにアカウントID等を残さない。

phases:
  install:
    commands:
      - echo "===== notation + AWS Signerプラグインのインストール ====="
      # notation CLIとAWS Signerプラグインを一括インストール（AWS配布のインストーラ）
      - curl -fsSL https://d2hvyiie56hcat.cloudfront.net/linux/amd64/installer/rpm/latest/aws-signer-notation-cli_amd64.rpm -o /tmp/notation.rpm
      - yum install -y /tmp/notation.rpm
      - notation version
      # 子manifestのdigest抽出に使うjqを明示的にインストール（標準イメージに同梱の見込みだが確実にするため）
      - yum install -y jq
      - jq --version

  pre_build:
    commands:
      - echo "===== pre_build 開始 ====="
      # ECRのURIを組み立てる
      - ECR_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"
      # タグ付きイメージ参照を組み立てる（build行にコロンを書かないための変数）
      - ECR_IMAGE="${ECR_URI}:${IMAGE_TAG}"
      # ECRにログイン
      - echo "ECRにログイン"
      - aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com
      # CodeArtifactの認証トークンを取得
      - echo "CodeArtifactトークンを取得"
      - export CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token --domain ${CODEARTIFACT_DOMAIN} --domain-owner ${CODEARTIFACT_DOMAIN_OWNER} --region ${AWS_REGION} --query authorizationToken --output text)

  build:
    commands:
      - echo "===== build 開始（マルチアーキ amd64 + arm64） ====="
      # buildx用のビルダーを作成して有効化（docker-containerドライバ）
      # 案B binfmt/QEMUを別途登録せず、buildx同梱のエミュレーションに任せる
      - docker buildx create --use --name multiarch-builder
      # ビルダーを初回起動（ここでエミュレーション対応プラットフォームが確定する）
      - docker buildx inspect --bootstrap
      # マルチアーキ（amd64+arm64）でビルドし、そのまま ECR へ push（--push）
      # マルチアーキ成果物はローカルに保持できないため build と push を一体化する
      # --provenance=false で来歴attestation（ECRで Other/unknown として出る）を付けない
      - docker buildx build --provenance=false --platform linux/amd64,linux/arm64 --build-arg CODEARTIFACT_AUTH_TOKEN=${CODEARTIFACT_AUTH_TOKEN} -t ${ECR_IMAGE} --push .

  post_build:
    commands:
      - echo "===== post_build 開始 ====="
      # ※ push は build フェーズの docker buildx --push で完了済み（ここでの docker push は不要）
      # ===== ここから AWS Signer + notation による署名 =====
      - echo "===== イメージ署名 開始（index＋子manifest） ====="
      # pushしたイメージのdigestを取得（タグではなくdigestで署名するのが安全）
      # ※マルチアーキの場合、この digest は image index（マニフェストリスト）の digest
      #   → まず index 全体に1署名を付ける（この後、子manifestにも個別署名する）
      - IMAGE_DIGEST=$(aws ecr describe-images --repository-name ${ECR_REPOSITORY} --image-ids imageTag=${IMAGE_TAG} --region ${AWS_REGION} --query 'imageDetails[0].imageDigest' --output text)
      - echo "署名対象 index digest=${IMAGE_DIGEST}"
      # notationのECR認証情報を環境変数で渡す（CodeBuild環境にはクレデンシャルストアが無いためloginは使わない）
      - export NOTATION_USERNAME=AWS
      - export NOTATION_PASSWORD=$(aws ecr get-login-password --region ${AWS_REGION})
      # ①index（目次）に署名
      - notation sign ${ECR_URI}@${IMAGE_DIGEST} --plugin "com.amazonaws.signer.notation.plugin" --id "${SIGNING_PROFILE_ARN}"
      # ②子manifest（amd64/arm64の本体）に個別署名
      #   jqのコロン・クォートでYAMLパースを崩さないよう、処理はヘルパースクリプトに隔離している
      #   スクリプトが使う変数を export してから呼び出す
      - export ECR_URI ECR_IMAGE SIGNING_PROFILE_ARN
      - bash scripts/sign-children.sh
      - echo "===== 完了 ====="
